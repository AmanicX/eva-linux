config_version = 20

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.79999998211860657
    capsule = true
    center = [ "clock", "media", "control-center" ]
    enabled = true
    end = [ "notifications", "clipboard", "battery", "session" ]
    font_family = "Adwaita Sans"
    margin_edge = 5
    margin_ends = 5
    margin_opposite_edge = 5
    radius = 16
    start = [ "launcher", "wallpaper", "active_window" ]
    thickness = 40
    widget_spacing = 10

[battery]
warning_threshold = 20

[hot_corners]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
screen_time_enabled = false

    [shell.launcher]
    track_usage = false

    [shell.panel]
    launcher_placement = "attached"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oasis Abyss"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "kitty", "niri", "gtk3", "gtk4" ]
    community_ids = []
    enable_builtin_templates = true

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/apex/Pictures/Wallpapers/wallpaperflare.com_wallpaper(22).jpg"

    [wallpaper.last]
    path = "/home/apex/Pictures/Wallpapers/wallpaperflare.com_wallpaper(22).jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/apex/Pictures/Wallpapers/wallpaperflare.com_wallpaper(22).jpg"