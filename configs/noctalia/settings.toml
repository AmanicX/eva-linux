config_version = 20

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.79999998211860657
    capsule = true
    center = [ "clock", "media", "control-center" ]
    enabled = true
    end = [ "notifications", "clipboard", "battery", "session" ]
    font_family = "Adwaita Sans"
    margin_edge = 5
    margin_ends = 5
    margin_opposite_edge = 5
    radius = 16
    start = [ "launcher", "wallpaper", "active_window" ]
    thickness = 40
    widget_spacing = 10

[battery]
warning_threshold = 20

[hot_corners]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[shell]
screen_time_enabled = false

    [shell.launcher]
    track_usage = false

    [shell.panel]
    launcher_placement = "attached"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "kitty", "niri", "gtk3", "gtk4" ]
    community_ids = []
    enable_builtin_templates = true

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/eva-crimson-temple.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/eva-crimson-temple.jpg"
